filter {
  if [agent][type] == "filebeat" and [log][file][path] == "/var/log/audit/audit.log" {
    grok {
      match => {
        "message" => "type=%{WORD:[auditd][record_type]} msg=audit\(%{NUMBER:[auditd][timestamp]}:%{INT:[auditd][sequence]}\): %{GREEDYDATA:[auditd][kv_raw]}"
      }
    }

    kv {
      source => "[auditd][kv_raw]"
      target => "[auditd][data]"
      field_split => " "
      value_split => "="
      trim_value => '"'
    }

    mutate {
      convert => {
        "[auditd][sequence]" => "integer"
        "[auditd][data][uid]" => "integer"
        "[auditd][data][auid]" => "integer"
        "[auditd][data][euid]" => "integer"
        "[auditd][data][gid]" => "integer"
        "[auditd][data][argc]" => "integer"
      }
    }

    date {
      match => [ "[auditd][timestamp]", "UNIX" ]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "process"
        "[event][type]" => "start"
        "[event][action]" => "executed"
        "[event][module]" => "auditd"
        "[event][dataset]" => "auditd.log"

        "[host][os][type]" => "linux"
      }
    }

    if [auditd][record_type] == "SYSCALL" {
      if [auditd][data][exe] {
        mutate {
          add_field => {
            "[process][executable]" => "%{[auditd][data][exe]}"
          }
        }

        ruby {
          code => '
            exe = event.get("[process][executable]")
            if exe
              event.set("[process][name]", File.basename(exe))
            end
          '
        }
      }

      if [auditd][data][pid] {
        mutate {
          add_field => {
            "[process][pid]" => "%{[auditd][data][pid]}"
          }
          convert => {
            "[process][pid]" => "integer"
          }
        }
      }

      if [auditd][data][ppid] {
        mutate {
          add_field => {
            "[process][parent][pid]" => "%{[auditd][data][ppid]}"
          }
          convert => {
            "[process][parent][pid]" => "integer"
          }
        }
      }

      if [auditd][data][uid] {
        mutate {
          add_field => {
            "[user][id]" => "%{[auditd][data][uid]}"
          }
        }
      }

      if [auditd][data][auid] {
        mutate {
          add_field => {
            "[user][audit][id]" => "%{[auditd][data][auid]}"
          }
        }
      }
    }

    if [auditd][record_type] == "EXECVE" {
      ruby {
        code => '
          data = event.get("[auditd][data]") || {}
          argc = data["argc"].to_i rescue 0
          args = []

          (0...argc).each do |i|
            v = data["a#{i}"]
            args << v if v
          end

          if args.length > 0
            event.set("[process][args]", args)
            event.set("[process][command_line]", args.join(" "))
            event.set("[process][name]", File.basename(args[0]))
          end
        '
      }
    }

    if [auditd][record_type] == "CWD" {
      if [auditd][data][cwd] {
        mutate {
          add_field => {
            "[process][working_directory]" => "%{[auditd][data][cwd]}"
          }
        }
      }
    }
  }
}
